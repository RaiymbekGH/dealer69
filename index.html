<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Общий чат</title>
<style>
  :root {
    --bg: #eceff3;
    --panel: #ffffff;
    --text: #1b1f24;
    --muted: #6a7480;
    --line: #dde2e8;
    --accent: #0f6e8c;
    --accent-text: #ffffff;
    --mine: #e1f1f6;
    --bubble: #ffffff;
    --danger: #b3261e;
    --author-l: 34%;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161a; --panel: #1b2026; --text: #e8ecf0; --muted: #8b95a1;
      --line: #2a313a; --accent: #3aa8c9; --accent-text: #0b1317;
      --mine: #1c3540; --bubble: #222932; --danger: #f2877f; --author-l: 70%;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161a; --panel: #1b2026; --text: #e8ecf0; --muted: #8b95a1;
    --line: #2a313a; --accent: #3aa8c9; --accent-text: #0b1317;
    --mine: #1c3540; --bubble: #222932; --danger: #f2877f; --author-l: 70%;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .app {
    height: 100%;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .who input {
    width: 130px; padding: 6px 10px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  #log {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 30ch; }
  .day {
    align-self: center; font-size: 12.5px; color: var(--muted);
    background: var(--bg); padding: 2px 12px; border-radius: 999px;
  }
  .msg { max-width: 82%; min-width: 0; align-self: flex-start; }
  .msg.mine { align-self: flex-end; }
  .bubble {
    background: var(--bubble); border: 1px solid var(--line);
    border-radius: 14px; padding: 8px 12px;
  }
  .mine .bubble { background: var(--mine); border-color: transparent; }
  .msg.target .bubble { outline: 2px solid var(--accent); outline-offset: 1px; }
  .msg.flash .bubble { animation: flash 1.4s ease-out; }
  @keyframes flash {
    from { box-shadow: 0 0 0 4px var(--accent); }
    to { box-shadow: 0 0 0 4px transparent; }
  }
  .meta { font-size: 12.5px; color: var(--muted); margin: 0 4px 3px; }
  .mine .meta { text-align: right; }
  .meta b { color: var(--author, var(--text)); font-weight: 600; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .quote {
    border-left: 3px solid var(--accent); padding: 2px 8px; margin: 0 0 6px;
    font-size: 13.5px; color: var(--muted); cursor: pointer; border-radius: 2px;
    display: flex; flex-direction: column; min-width: 0;
  }
  .quote b { color: var(--author, var(--accent)); font-weight: 600; }
  .quote span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .media { display: block; max-width: 100%; max-height: 360px; border-radius: 10px; margin-top: 8px; }
  .bubble > .media:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 10px; margin-top: 8px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); text-decoration: none; background: var(--panel);
  }
  .bubble > .file:first-child { margin-top: 0; }
  .file:hover { border-color: var(--accent); }
  .file svg { flex: none; color: var(--accent); }
  .file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file small { color: var(--muted); margin-left: auto; padding-left: 8px; flex: none; }
  .actions { display: flex; gap: 14px; margin: 3px 6px 0; font-size: 12.5px; }
  .mine .actions { justify-content: flex-end; }
  .actions button {
    border: 0; background: none; color: var(--muted); cursor: pointer;
    font: inherit; padding: 4px 0;
  }
  .actions button:hover { color: var(--text); }
  .actions .danger:hover { color: var(--danger); }
  .composer { border-top: 1px solid var(--line); padding: 10px 12px; }
  #err { color: var(--danger); font-size: 14px; margin: 0 2px 8px; }
  #err:empty { display: none; }
  .replybar {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    padding: 6px 6px 6px 10px; font-size: 13.5px; color: var(--muted);
    border-left: 3px solid var(--accent); background: var(--bg); border-radius: 8px;
  }
  .replybar[hidden] { display: none; }
  .replybar div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .replybar b { color: var(--author, var(--accent)); font-weight: 600; }
  .replybar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .replybar button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 20px; line-height: 1; padding: 4px 10px; border-radius: 999px;
  }
  .replybar button:hover { color: var(--text); }
  #pending { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #pending:empty { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    padding: 4px 6px 4px 10px; font-size: 13px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .chip button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 999px;
  }
  .chip button:hover { color: var(--text); }
  .row { display: flex; align-items: flex-end; gap: 8px; }
  textarea {
    flex: 1; resize: none; max-height: 140px; min-height: 42px;
    padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  }
  textarea:focus, input:focus, button:focus-visible, .file:focus-visible, .quote:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .icon-btn, .send {
    flex: none; height: 42px; border-radius: 12px; border: 1px solid var(--line);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    font: inherit;
  }
  .icon-btn { width: 42px; background: var(--bg); color: var(--text); }
  .icon-btn:hover { border-color: var(--accent); }
  .send { padding: 0 16px; background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  .send:disabled { opacity: .45; cursor: default; }
  #drop {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    font-size: 20px; font-weight: 600; z-index: 10; pointer-events: none;
    border: 3px dashed var(--accent); margin: 12px; border-radius: 16px;
  }
  body.dragging #drop { display: flex; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Общий чат</h1>
    <label class="who">Имя
      <input id="name" maxlength="24" placeholder="Гость" autocomplete="nickname">
    </label>
  </header>

  <main id="log" aria-live="polite">
    <div class="empty" id="empty">Загрузка…</div>
  </main>

  <div class="composer">
    <div id="err" role="alert"></div>
    <div class="replybar" id="replybar" hidden>
      <div><b id="replyName"></b><span id="replyText"></span></div>
      <button type="button" id="replyCancel" aria-label="Отменить ответ">×</button>
    </div>
    <div id="pending"></div>
    <div class="row">
      <input type="file" id="file" multiple class="sr" tabindex="-1">
      <button class="icon-btn" id="attach" type="button" aria-label="Прикрепить файл">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>
      </button>
      <textarea id="text" rows="1" placeholder="Сообщение"></textarea>
      <button class="send" id="send" type="button" disabled>Отправить</button>
    </div>
  </div>
</div>
<div id="drop">Отпусти файл, чтобы прикрепить</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://cgurdkntrzjcmbxxajbp.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_UoGFUoWn0qi7-a_v0BhNkQ_vHB8Bvdn';
  var BUCKET = 'chat-files';
  var MAX_FILE = 20 * 1024 * 1024;
  var FILE_PREFIX = SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/';

  var log = document.getElementById('log');
  var empty = document.getElementById('empty');
  var textEl = document.getElementById('text');
  var sendBtn = document.getElementById('send');
  var fileInput = document.getElementById('file');
  var pendingEl = document.getElementById('pending');
  var nameEl = document.getElementById('name');
  var errEl = document.getElementById('err');
  var replyBar = document.getElementById('replybar');
  var replyNameEl = document.getElementById('replyName');
  var replyTextEl = document.getElementById('replyText');

  var pending = [];
  var sending = false;
  var shown = {};   // id -> элемент
  var data = {};    // id -> данные сообщения
  var myIds = {};   // старые сообщения этого устройства (до появления ключа автора)
  var replyTo = null;
  var lastDay = '';
  var myKey = null;
  var myHash = null;

  if (!window.supabase) {
    empty.textContent = 'Не удалось загрузить "библиотеку". Проверь интернет и обнови страницу.';
    return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---- имя и «мои» сообщения ----
  try { nameEl.value = localStorage.getItem('chat-name') || ''; } catch (e) {}
  nameEl.addEventListener('input', function () {
    try { localStorage.setItem('chat-name', nameEl.value); } catch (e) {}
  });
  function myName() { return nameEl.value.trim() || 'Гость'; }

  try { JSON.parse(localStorage.getItem('chat-my-ids') || '[]').forEach(function (i) { myIds[i] = 1; }); } catch (e) {}
  function rememberMine(id) {
    myIds[id] = 1;
    try { localStorage.setItem('chat-my-ids', JSON.stringify(Object.keys(myIds).slice(-500))); } catch (e) {}
  }

  // секретный ключ автора: живёт только в этом браузере, в базу уходит лишь его хэш
  function randomHex(n) {
    var a = new Uint8Array(n); crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function sha256hex(str) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  var ready;
  try {
    try { myKey = localStorage.getItem('chat-author-key'); } catch (e) {}
    if (!myKey) {
      myKey = randomHex(32);
      try { localStorage.setItem('chat-author-key', myKey); } catch (e) {}
    }
    ready = sha256hex(myKey).then(function (h) { myHash = h; }).catch(function () {});
  } catch (e) {
    ready = Promise.resolve();
  }

  function showErr(t) { errEl.textContent = t || ''; }

  function size(n) {
    if (n < 1024) return n + ' Б';
    if (n < 1048576) return Math.round(n / 1024) + ' КБ';
    return (n / 1048576).toFixed(1) + ' МБ';
  }

  function refresh() {
    sendBtn.disabled = sending || (!textEl.value.trim() && pending.length === 0);
    sendBtn.textContent = sending ? 'Отправка…' : 'Отправить';
    pendingEl.textContent = '';
    pending.forEach(function (f, i) {
      var chip = document.createElement('div'); chip.className = 'chip';
      var s = document.createElement('span'); s.textContent = f.name;
      var x = document.createElement('button'); x.type = 'button';
      x.setAttribute('aria-label', 'Убрать ' + f.name); x.textContent = '×';
      x.onclick = function () { pending.splice(i, 1); refresh(); };
      chip.appendChild(s); chip.appendChild(x); pendingEl.appendChild(chip);
    });
  }

  function addFiles(list) {
    showErr('');
    Array.prototype.forEach.call(list, function (f) {
      if (f.size > MAX_FILE) { showErr('Файл «' + f.name + '» больше 20 МБ и не добавлен.'); return; }
      pending.push(f);
    });
    refresh();
  }

  // ---- вложения ----
  function fileNode(f) {
    if (!f || typeof f.url !== 'string' || f.url.indexOf(FILE_PREFIX) !== 0) return null;
    var type = typeof f.type === 'string' ? f.type : '';
    var name = typeof f.name === 'string' ? f.name : 'файл';
    if (type.indexOf('image/') === 0 && type !== 'image/svg+xml') {
      var img = document.createElement('img'); img.className = 'media';
      img.src = f.url; img.alt = name; img.loading = 'lazy'; return img;
    }
    if (type.indexOf('video/') === 0) {
      var v = document.createElement('video'); v.className = 'media';
      v.src = f.url; v.controls = true; v.preload = 'metadata'; v.playsInline = true; return v;
    }
    if (type.indexOf('audio/') === 0) {
      var a = document.createElement('audio'); a.className = 'media';
      a.src = f.url; a.controls = true; return a;
    }
    var link = document.createElement('a'); link.className = 'file';
    link.href = f.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
    link.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
    var n = document.createElement('span'); n.textContent = name;
    var s = document.createElement('small'); s.textContent = typeof f.size === 'number' ? size(f.size) : '';
    link.appendChild(n); link.appendChild(s); return link;
  }

  // ---- время, цвета, дни ----
  function timeLabel(iso) {
    var d = new Date(iso), now = new Date();
    var t = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return t;
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + t;
  }
  function dayLabel(d) {
    var now = new Date(), y = new Date(); y.setDate(now.getDate() - 1);
    if (d.toDateString() === now.toDateString()) return 'Сегодня';
    if (d.toDateString() === y.toDateString()) return 'Вчера';
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  }
  function authorColor(name) {
    var h = 0, s = name.toLowerCase();
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return 'hsl(' + h + ' 60% var(--author-l))';
  }

  // ---- ответы ----
  function previewOf(m) {
    var t = (m.text || '').replace(/\s+/g, ' ').trim();
    if (t) return t.slice(0, 120);
    var files = Array.isArray(m.files) ? m.files : [];
    if (files.length) return 'Вложение: ' + (files[0].name || 'файл');
    return '';
  }

  function fillQuote(q) {
    var o = data[q.dataset.ref];
    q.textContent = '';
    if (!o || o.deleted) {
      var s0 = document.createElement('span');
      s0.textContent = 'Исходное сообщение удалено или недоступно';
      q.appendChild(s0);
      return;
    }
    var b = document.createElement('b'); b.textContent = o.name || 'Гость';
    b.style.setProperty('--author', authorColor(o.name || 'Гость'));
    var s = document.createElement('span'); s.textContent = previewOf(o);
    q.appendChild(b); q.appendChild(s);
  }

  function jumpTo(id) {
    var el = shown[id];
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }

  function quoteNode(refId) {
    var q = document.createElement('div'); q.className = 'quote';
    q.dataset.ref = String(refId);
    q.setAttribute('role', 'button'); q.tabIndex = 0;
    fillQuote(q);
    q.addEventListener('click', function () { jumpTo(refId); });
    q.addEventListener('keydown', function (e) { if (e.key === 'Enter') jumpTo(refId); });
    return q;
  }

  function clearTarget() {
    Object.keys(shown).forEach(function (k) { shown[k].classList.remove('target'); });
  }
  function startReply(m) {
    clearTarget();
    replyTo = m;
    replyNameEl.textContent = m.name || 'Гость';
    replyNameEl.style.setProperty('--author', authorColor(m.name || 'Гость'));
    replyTextEl.textContent = previewOf(m);
    replyBar.hidden = false;
    if (shown[m.id]) shown[m.id].classList.add('target');
    textEl.focus();
  }
  function cancelReply() {
    replyTo = null; replyBar.hidden = true; clearTarget();
  }
  document.getElementById('replyCancel').addEventListener('click', cancelReply);

  // ---- удаление ----
  function removeMsg(id) {
    if (data[id]) data[id].deleted = true; else data[id] = { deleted: true };
    if (shown[id]) { shown[id].remove(); delete shown[id]; }
    if (replyTo && String(replyTo.id) === String(id)) cancelReply();
    Array.prototype.forEach.call(document.querySelectorAll('.quote'), function (q) {
      if (q.dataset.ref === String(id)) fillQuote(q);
    });
  }

  function del(m) {
    if (!confirm('Удалить сообщение?<br>Это нельзя отменить.')) return;
    showErr('');
    sb.rpc('delete_message', { msg_id: m.id, author_key: myKey }).then(function (res) {
      if (res.error) throw res.error;
      if (res.data !== true) { showErr('Не удалось удалить: это сообщение не ваше.'); return; }
      removeMsg(m.id);
    }).catch(function (e) {
      showErr('Не удалось удалить: ' + (e && e.message ? e.message : 'ошибка сети'));
    });
  }

  function actionBtn(label, cls, fn) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener('click', fn); return b;
  }

  // ---- вывод сообщения ----
  function render(m, forceMine) {
    if (shown[m.id] || (data[m.id] && data[m.id].deleted)) return;
    data[m.id] = m;
    var mine = !!forceMine || (!!myHash && m.author_hash === myHash) || !!myIds[m.id];
    var canDelete = !!myHash && m.author_hash === myHash;

    if (empty) { empty.remove(); empty = null; }
    var nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 120;

    var created = new Date(m.created_at);
    if (created.toDateString() !== lastDay) {
      var sep = document.createElement('div'); sep.className = 'day';
      sep.textContent = dayLabel(created); log.appendChild(sep);
      lastDay = created.toDateString();
    }

    var name = String(m.name || 'Гость').slice(0, 24);
    var msg = document.createElement('div'); msg.className = 'msg' + (mine ? ' mine' : '');
    msg.style.setProperty('--author', authorColor(name));

    var meta = document.createElement('div'); meta.className = 'meta';
    var b = document.createElement('b'); b.textContent = name + (mine ? ' (вы)' : '');
    var t = document.createElement('span'); t.textContent = ' · ' + timeLabel(m.created_at);
    meta.appendChild(b); meta.appendChild(t);

    var bubble = document.createElement('div'); bubble.className = 'bubble';
    if (m.reply_to) bubble.appendChild(quoteNode(m.reply_to));
    if (m.text) {
      var p = document.createElement('div'); p.className = 'text'; p.textContent = String(m.text);
      bubble.appendChild(p);
    }
    (Array.isArray(m.files) ? m.files : []).forEach(function (f) {
      var node = fileNode(f); if (node) bubble.appendChild(node);
    });

    var actions = document.createElement('div'); actions.className = 'actions';
    actions.appendChild(actionBtn('Ответить', '', function () { startReply(m); }));
    if (canDelete) actions.appendChild(actionBtn('Удалить', 'danger', function () { del(m); }));

    msg.appendChild(meta); msg.appendChild(bubble); msg.appendChild(actions);
    log.appendChild(msg);
    shown[m.id] = msg;
    if (nearBottom || mine) log.scrollTop = log.scrollHeight;
  }

  // ---- отправка ----
  function uploadOne(f) {
    var ext = (f.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8);
    var id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : randomHex(16);
    var path = new Date().toISOString().slice(0, 10) + '/' + id + (ext ? '.' + ext : '');
    return sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || 'application/octet-stream', upsert: false })
      .then(function (res) {
        if (res.error) throw res.error;
        var url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
        return { url: url, name: f.name, type: f.type || '', size: f.size };
      });
  }

  function post() {
    var text = textEl.value.trim();
    if (sending || (!text && !pending.length)) return;
    sending = true; showErr(''); refresh();
    var toSend = pending.slice();

    Promise.all(toSend.map(uploadOne)).then(function (files) {
      return sb.from('messages').insert({
        name: myName(),
        text: text || null,
        files: files,
        reply_to: replyTo ? replyTo.id : null,
        author_hash: myHash
      }).select().single();
    }).then(function (res) {
      if (res.error) throw res.error;
      if (!myHash) rememberMine(res.data.id);
      render(res.data, !myHash);
      textEl.value = ''; textEl.style.height = 'auto'; pending = [];
      cancelReply();
    }).catch(function (e) {
      showErr('Не удалось отправить: ' + (e && e.message ? e.message : 'ошибка сети') + '. Текст и файлы сохранены, попробуй ещё раз.');
    }).then(function () {
      sending = false; refresh(); textEl.focus();
    });
  }

  // ---- загрузка истории и живые обновления ----
  ready.then(function () {
    return sb.from('messages').select('*').order('created_at', { ascending: false }).limit(200);
  }).then(function (res) {
    if (res.error) throw res.error;
    var rows = res.data.reverse();
    if (!rows.length) { empty.textContent = 'Сообщений пока нет. Напиши первым или отправь файл!'; return; }
    rows.forEach(function (m) { render(m); });
    log.scrollTop = log.scrollHeight;
  }).catch(function (e) {
    empty.textContent = 'Не удалось загрузить сообщения: ' + (e && e.message ? e.message : 'ошибка сети');
  });

  sb.channel('chat-messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, function (p) {
      render(p.new);
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, function (p) {
      if (p.old && p.old.id != null) removeMsg(p.old.id);
    })
    .subscribe();

  // ---- ввод ----
  textEl.addEventListener('input', function () {
    textEl.style.height = 'auto';
    textEl.style.height = Math.min(textEl.scrollHeight, 140) + 'px';
    refresh();
  });
  textEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); post(); }
  });
  textEl.addEventListener('paste', function (e) {
    var files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { e.preventDefault(); addFiles(files); }
  });
  sendBtn.addEventListener('click', post);
  document.getElementById('attach').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { addFiles(fileInput.files); fileInput.value = ''; });

  var depth = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); depth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', function () { depth = Math.max(0, depth - 1); if (!depth) document.body.classList.remove('dragging'); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); depth = 0; document.body.classList.remove('dragging');
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
})();
</script>
</body>
</html>
